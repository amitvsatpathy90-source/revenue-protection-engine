# VT pinning trace is JVM-arg only:
# -Djdk.tracePinnedThreads=full (no Spring property)

rpe:
  dev:
    blockhound:
      enabled: true        # 5-10% instrumentation overhead — dev only
    reactor-debug-agent: true  # significant overhead — dev only

# Dev-only: expose Resilience4j CB state transitions and failure causes.
logging:
  level:
    io.github.resilience4j.circuitbreaker: DEBUG