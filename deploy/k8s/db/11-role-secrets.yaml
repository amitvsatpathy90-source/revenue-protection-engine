# Per-service Postgres login-role credentials.
# Each service connects as its OWN named role — no shared 'rpe' superuser (Stage 6 rule #1).
# username MUST match the role name in 10-cluster.yaml managed.roles[*].name so that
# CloudNativePG's managed-roles controller links the secret to the role.
#
# PASSWORDS SHIP BLANK — a credential-shaped value never belongs in git, even a lab one. This is
# symmetric with rpe-prometheus-scrape-token (54-prometheus.yaml), which the repo already ships
# blank + fills imperatively. Apply this file first (blank stubs), then fill imperatively — CNPG's
# managed-roles controller reconciles the real password onto each role before the service pods start:
#
#   for svc in detection relay alert triage; do
#     kubectl -n rpe create secret generic rpe-${svc}-db \
#       --type=kubernetes.io/basic-auth \
#       --from-literal=username=${svc}_role \
#       --from-literal=password="$(openssl rand -base64 24)" \
#       --dry-run=client -o yaml | kubectl apply -f -
#   done
#
# Re-applying THIS file after that resets the passwords to blank — fill again, or (prod) replace
# with an ExternalSecrets / Vault-backed source and drop these stubs entirely. Never commit real
# credentials. The username stays here (a role name, not a secret); only password is blanked.
---
apiVersion: v1
kind: Secret
metadata:
  name: rpe-detection-db
  namespace: rpe
type: kubernetes.io/basic-auth
stringData:
  username: detection_role
  password: ""        # FILL IMPERATIVELY (see header) — never commit a real value
---
apiVersion: v1
kind: Secret
metadata:
  name: rpe-relay-db
  namespace: rpe
type: kubernetes.io/basic-auth
stringData:
  username: relay_role
  password: ""        # FILL IMPERATIVELY (see header) — never commit a real value
---
apiVersion: v1
kind: Secret
metadata:
  name: rpe-alert-db
  namespace: rpe
type: kubernetes.io/basic-auth
stringData:
  username: alert_role
  password: ""        # FILL IMPERATIVELY (see header) — never commit a real value
---
apiVersion: v1
kind: Secret
metadata:
  name: rpe-triage-db
  namespace: rpe
type: kubernetes.io/basic-auth
stringData:
  username: triage_role
  password: ""        # FILL IMPERATIVELY (see header) — never commit a real value
